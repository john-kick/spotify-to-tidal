<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Result Page</title>
	<link rel="stylesheet" href="styles/styles.css" />
	<script src="scripts/result.js" defer></script>
</head>

<body>
	<h1>Spotify to Tidal</h1>
	<main hidden>
		<div id="page-content">
			<h2>Migration Result</h2>
			<div class="pulser">
			</div>
			<div id="result-details" hidden>
				<div id="liked-songs" class="result-section card">
					<div class="card-header">
						<img src="images/heart.svg" />
						<h3>Liked Songs</h3>
					</div>
					<div class="card-content">
						<p id="liked-songs-result">You have successfully migrated X liked songs.</p>
					</div>
				</div>
				<div id="playlists" class="result-section card">
					<div class="card-header">
						<img src="images/list-music.svg" />
						<h3>Playlists</h3>
					</div>
					<div class="card-content">
						<p id="playlists-result">You have successfully migrated Y playlists.</p>
					</div>
				</div>
			</div>
			<a href="/">
				<button id="btn-back" style="position: relative">Back to Home</button>
			</a>
		</div>
	</main>
</body>

</html>
